<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600|Open+Sans:400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="/css/spur.css">

    <title>Doctor Dashboard</title>

    <style>
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title {
            font-weight: 600;
        }
        .table th {
            background-color: #f8f9fa;
        }
        .btn-sm {
            min-width: 70px;
        }
        .empty-row {
            text-align: center;
            color: #888;
            font-style: italic;
        }
        .form-group label {
            font-weight: 600;
        }
    </style>
</head>

<body>
<div class="dash">
    <div th:replace="fragments/nav :: nav"></div>

    <div class="dash-app">
        <!-- HEADER -->
        <header class="dash-toolbar">
            <a href="#!" class="menu-toggle">
                <i class="fas fa-bars"></i>
            </a>
            <h4 class="ml-4">Doctor Dashboard</h4>

            <div class="tools">
                <div class="dropdown tools-item">
                    <a href="#" id="dropdownMenu1" data-toggle="dropdown">
                        <i class="fas fa-user"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <form th:action="@{/logout}" method="post">
                            <input class="dropdown-item" type="submit" value="Logout"/>
                        </form>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN -->
        <main class="dash-content">
            <div class="container-fluid">

                <!-- DOCTOR TABLE -->
                <div class="card spur-card mb-4">
                    <div class="card-header">
                        <span class="card-title">
                            <i class="fas fa-user-md mr-2"></i>All Doctors
                        </span>
                    </div>

                    <div class="card-body">
                        <table class="table table-hover table-bordered">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Specialty</th>
                                <th>Schedule</th>
                                <th>Phone</th>
                                <th colspan="2" class="text-center">Actions</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:if="${doctors.empty}">
                                <td colspan="8" class="empty-row">No doctors available</td>
                            </tr>

                            <tr th:each="doctor : ${doctors}">
                                <td th:text="${doctor.id}"></td>
                                <td th:text="${doctor.firstName}"></td>
                                <td th:text="${doctor.lastName}"></td>
                                <td th:text="${doctor.specialty}"></td>
                                <td th:text="${doctor.address}"></td>
                                <td th:text="${doctor.mobileNo}"></td>

                                <td class="text-center">
                                    <a th:href="@{/admin/doctor/edit/{id}(id=${doctor.id})}">
                                        <button class="btn btn-primary btn-sm">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                    </a>
                                </td>

                                <td class="text-center">
                                    <a th:href="@{/admin/doctor/{id}(id=${doctor.id})}">
                                        <button class="btn btn-danger btn-sm">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- ADD DOCTOR FORM -->
                <div class="card spur-card">
                    <div class="card-header">
                        <span class="card-title">
                            <i class="fas fa-user-plus mr-2"></i>Add New Doctor
                        </span>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/admin/doctor}" th:object="${doctor}" method="post">

                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" class="form-control"
                                       th:field="*{firstName}" placeholder="Enter first name" required>
                            </div>

                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" class="form-control"
                                       th:field="*{lastName}" placeholder="Enter last name" required>
                            </div>

                            <div class="form-group">
                                <label>Specialty</label>
                                <input type="text" class="form-control"
                                       th:field="*{specialty}" placeholder="Enter specialty" required>
                            </div>

                            <div class="form-group">
                                <label>Schedule</label>
                                <input type="text" class="form-control"
                                       th:field="*{address}" 
                                       placeholder="e.g., Mon-Fri 10AM–2PM" required>
                            </div>

                            <div class="form-group">
                                <label>Phone</label>
                                <input type="tel" class="form-control"
                                       th:field="*{mobileNo}" placeholder="Enter phone number" required>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-check"></i> Add Doctor
                                </button>
                                <button type="reset" class="btn btn-secondary ml-2">
                                    Reset
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script src="/js/spur.js"></script>

</body>
</html>
