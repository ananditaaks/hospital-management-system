<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600|Open+Sans:400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="/css/spur.css">

    <title>Edit Appointment</title>

    <style>
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title {
            font-weight: 600;
        }
        .form-group label {
            font-weight: 600;
        }
    </style>
</head>

<body>
<div class="dash">
    <div th:replace="fragments/nav :: nav"></div>

    <div class="dash-app">
        <!-- HEADER -->
        <header class="dash-toolbar">
            <a href="#!" class="menu-toggle">
                <i class="fas fa-bars"></i>
            </a>
            <h4 class="ml-4">Edit Appointment</h4>

            <div class="tools">
                <div class="dropdown tools-item">
                    <a href="#" id="dropdownMenu1" data-toggle="dropdown">
                        <i class="fas fa-user"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <form th:action="@{/logout}" method="post">
                            <input class="dropdown-item" type="submit" value="Logout"/>
                        </form>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN -->
        <main class="dash-content">
            <div class="container-fluid">

                <div class="card spur-card">
                    <div class="card-header">
                        <span class="card-title">
                            <i class="fas fa-edit mr-2"></i>Update Appointment Details
                        </span>
                    </div>

                    <div class="card-body">
                        <form th:object="${appointment}" 
                              th:action="@{/admin/appointment/edit/{id}(id=${appointment.id})}" 
                              method="post">

                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" class="form-control"
                                       th:field="*{fullName}" 
                                       placeholder="Enter full name" required>
                            </div>

                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" class="form-control"
                                       th:field="*{email}" 
                                       placeholder="Enter email" required>
                            </div>

                            <div class="form-group">
                                <label>Message / Symptoms</label>
                                <textarea class="form-control"
                                          th:field="*{message}" 
                                          rows="3"
                                          placeholder="Describe symptoms" required></textarea>
                            </div>

                            <div class="form-group d-flex">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save"></i> Update
                                </button>

                                <a th:href="@{/admin/appointment}" class="ml-2">
                                    <button type="button" class="btn btn-secondary">
                                        Cancel
                                    </button>
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script src="/js/spur.js"></script>

</body>
</html>
