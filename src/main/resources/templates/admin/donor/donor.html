<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600|Open+Sans:400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="/css/spur.css">

    <title>Donor Dashboard</title>

    <style>
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title {
            font-weight: 600;
        }
        .table th {
            background-color: #f8f9fa;
        }
        .btn-sm {
            min-width: 70px;
        }
        .empty-row {
            text-align: center;
            color: #888;
            font-style: italic;
        }
        .form-group label {
            font-weight: 600;
        }
    </style>
</head>

<body>
<div class="dash">
    <div th:replace="fragments/nav :: nav"></div>

    <div class="dash-app">
        <!-- HEADER -->
        <header class="dash-toolbar">
            <a href="#!" class="menu-toggle">
                <i class="fas fa-bars"></i>
            </a>
            <h4 class="ml-4">Donor Dashboard</h4>

            <div class="tools">
                <div class="dropdown tools-item">
                    <a href="#" id="dropdownMenu1" data-toggle="dropdown">
                        <i class="fas fa-user"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <form th:action="@{/logout}" method="post">
                            <input class="dropdown-item" type="submit" value="Logout"/>
                        </form>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN -->
        <main class="dash-content">
            <div class="container-fluid">

                <!-- DONOR TABLE -->
                <div class="card spur-card mb-4">
                    <div class="card-header">
                        <span class="card-title">
                            <i class="fas fa-hand-holding-heart mr-2"></i>All Donors
                        </span>
                    </div>

                    <div class="card-body">
                        <table class="table table-hover table-bordered">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Date</th>
                                <th>Message</th>
                                <th>Lab Name</th>
                                <th colspan="2" class="text-center">Actions</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:if="${donors.empty}">
                                <td colspan="8" class="empty-row">No donors available</td>
                            </tr>

                            <tr th:each="donor : ${donors}">
                                <td th:text="${donor.id}"></td>
                                <td th:text="${donor.fullName}"></td>
                                <td th:text="${donor.email}"></td>
                                <td th:text="${donor.date}"></td>
                                <td th:text="${donor.message}"></td>
                                <td th:text="${donor.laboratory.labName}"></td>

                                <td class="text-center">
                                    <a th:href="@{/admin/donor/edit/{id}(id=${donor.id})}">
                                        <button class="btn btn-primary btn-sm">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                    </a>
                                </td>

                                <td class="text-center">
                                    <a th:href="@{/admin/donor/{id}(id=${donor.id})}">
                                        <button class="btn btn-danger btn-sm">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- ADD DONOR FORM -->
                <div class="card spur-card">
                    <div class="card-header">
                        <span class="card-title">
                            <i class="fas fa-user-plus mr-2"></i>Add New Donor
                        </span>
                    </div>

                    <div class="card-body">
                        <form th:object="${donor}" th:action="@{/admin/donor}" method="post">

                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" class="form-control"
                                       th:field="*{fullName}" placeholder="Enter full name" required>
                            </div>

                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" class="form-control"
                                       th:field="*{email}" placeholder="Enter email" required>
                            </div>

                            <div class="form-group">
                                <label>Message</label>
                                <textarea class="form-control"
                                          th:field="*{message}" rows="3"
                                          placeholder="Write message" required></textarea>
                            </div>

                            <div class="form-group">
                                <label>Lab Name</label>
                                <select th:field="*{laboratory.id}" class="form-control" required>
                                    <option disabled selected value="">Select a Lab</option>
                                    <option th:each="lab : ${laboratories}"
                                            th:value="${lab.id}"
                                            th:text="${lab.labName}">
                                    </option>
                                </select>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-check"></i> Add Donor
                                </button>
                                <button type="reset" class="btn btn-secondary ml-2">
                                    Reset
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script src="/js/spur.js"></script>

</body>
</html>
